  contact:
    title: Trabaja con nosotros
    body: "Trabajamos con fondos de inversión que buscan participar en la expansión energética de la región, y con socios tecnológicos y operativos que nos ayuden a construir, desplegar y operar generación a escala. Si eres uno de ellos, hablemos."
  footer: "Gravitas Energy"

